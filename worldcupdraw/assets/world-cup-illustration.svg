<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc">
  <title id="title">Stylised World Cup trophy</title>
  <desc id="desc">A more realistic golden football trophy with highlights, contours and a dark plinth.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7c8" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fff7c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldMain" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="0.2" stop-color="#f7d96f"/>
      <stop offset="0.45" stop-color="#dca62b"/>
      <stop offset="0.72" stop-color="#a76e11"/>
      <stop offset="1" stop-color="#6d4307"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dca72b"/>
      <stop offset="100%" stop-color="#7b4d08"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#9c620e"/>
      <stop offset="0.5" stop-color="#f9dc72"/>
      <stop offset="1" stop-color="#8c590c"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3e260d"/>
      <stop offset="100%" stop-color="#170c03"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="40%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#fffbe2"/>
      <stop offset="0.38" stop-color="#f8df7d"/>
      <stop offset="0.78" stop-color="#c68a1d"/>
      <stop offset="1" stop-color="#895508"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="320" height="420" rx="28" fill="none"/>
  <ellipse cx="160" cy="94" rx="90" ry="92" fill="url(#bgGlow)" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <ellipse cx="160" cy="393" rx="76" ry="14" fill="#000" opacity=".28"/>

    <g>
      <circle cx="160" cy="82" r="50" fill="url(#ballGlow)"/>
      <path d="M122 96c10-26 36-43 63-40 15 2 28 8 37 18-19-5-34-4-50 3-16 7-31 19-50 37Z" fill="#fff9db" opacity=".78"/>
      <path d="M194 44c16 7 27 22 31 38-7-6-16-10-27-11 3-9 2-18-4-27Z" fill="#8a5708" opacity=".35"/>
      <path d="M130 76c8-10 22-16 34-15 7 1 13 4 17 8-10-1-18 0-27 5-8 4-15 9-24 17Z" fill="#fffef4" opacity=".85"/>
