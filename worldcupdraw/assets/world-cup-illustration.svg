    <path d="M194 115c-7 21-22 36-34 47-12 11-18 20-18 33 0 11 4 21 9 33 10 24 17 52 2 83l14 7c18-35 10-67 0-91-4-11-8-20-8-29 0-7 4-13 13-21 15-14 31-31 39-58Z" fill="#8d590b" opacity=".55"/>

    <path d="M112 144c8 19 24 34 43 40 18 5 39 2 54-9 14-10 24-27 27-46-7 12-18 19-27 22-13 5-24 1-35-5-13-7-26-12-42-11-8 1-14 4-20 9Z" fill="url(#goldMain)"/>
    <path d="M131 136c10 11 23 20 37 23 16 3 31 0 44-9-8 16-23 29-42 32-22 4-43-5-54-23 5-9 9-16 15-23Z" fill="#c88617" opacity=".55"/>

