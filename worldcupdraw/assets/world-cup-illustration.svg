    <rect x="100" y="382" width="120" height="22" rx="10" fill="url(#baseGrad)"/>
    <rect x="94" y="401" width="132" height="13" rx="6.5" fill="#0e0803"/>

    <path d="M155 35c7-5 17-7 28-4-8 2-14 6-19 12-4 5-7 12-8 19-4-10-4-20-1-27Z" fill="#fff9dd" opacity=".7"/>
    <path d="M114 147c17 10 38 14 58 10 14-3 28-10 39-21-7 18-20 33-39 40-25 10-54 4-74-16 4-5 8-9 16-13Z" fill="#fff1b5" opacity=".32"/>
